<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goal Explainer</title>
<!--
  Founder explainer template. Self-contained: no network resources.
  The chief copies this file to .runs/<goal>/explainer.html and replaces the JSON in the
  #goal-data block. Nothing else needs editing. "view" selects the initial tab:
  "approval" at goal approval, "merge" at milestone merge.
-->
<style>
:root {
  --bg: #fbfaf7; --surface: #ffffff; --text: #1d1d1b; --muted: #5f5e58; --line: #e3e1da;
  --accent: #2f5d8a; --accent-text: #ffffff; --pass: #2e6b3a; --pass-bg: #e6f2e8;
  --block: #9a2f24; --block-bg: #f8e5e2; --warn: #7a5a12; --warn-bg: #f6eed8;
  --radius: 8px; --gap: 16px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171716; --surface: #21211f; --text: #ecebe6; --muted: #a9a79f; --line: #3a3935;
    --accent: #8db6dd; --accent-text: #10161c; --pass: #8fcf9b; --pass-bg: #1f3324;
    --block: #f0a196; --block-bg: #3a2220; --warn: #e5c675; --warn-bg: #3a3020;
  }
}
:root[data-theme="dark"] {
  --bg: #171716; --surface: #21211f; --text: #ecebe6; --muted: #a9a79f; --line: #3a3935;
  --accent: #8db6dd; --accent-text: #10161c; --pass: #8fcf9b; --pass-bg: #1f3324;
  --block: #f0a196; --block-bg: #3a2220; --warn: #e5c675; --warn-bg: #3a3020;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
header h1 { font-size: 1.5rem; margin: 0 0 4px; }
header p { margin: 0; color: var(--muted); }
nav { display: flex; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
nav button {
  font: inherit; padding: 8px 14px; border-radius: var(--radius); cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
}
nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--gap); margin-bottom: var(--gap); }
section h2 { font-size: 1.1rem; margin: 0 0 10px; }
section h3 { font-size: 1rem; margin: 14px 0 6px; }
ul { margin: 0; padding-left: 20px; }
li + li { margin-top: 4px; }
.muted { color: var(--muted); }
code, .mono { font-family: var(--mono); font-size: 0.88em; overflow-wrap: anywhere; }
.table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
.table th, .table td { text-align: left; vertical-align: top; padding: 6px 8px; border-top: 1px solid var(--line); }
.table th { color: var(--muted); font-weight: 600; border-top: none; }
.scroll { overflow-x: auto; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 0.85em; font-weight: 600; }
.pass { color: var(--pass); background: var(--pass-bg); }
.block { color: var(--block); background: var(--block-bg); }
.warn { color: var(--warn); background: var(--warn-bg); }
.empty { color: var(--muted); font-style: italic; }
[hidden] { display: none !important; }
@media (max-width: 600px) {
  .table thead { display: none; }
  .table tr { display: block; border-top: 1px solid var(--line); padding: 6px 0; }
  .table td { display: block; border: none; padding: 2px 0; }
  .table td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); font-weight: 600; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Goal</h1>
    <p id="outcome"></p>
  </header>
  <nav role="tablist">
    <button type="button" role="tab" id="tab-approval" data-view="approval">Approval</button>
    <button type="button" role="tab" id="tab-merge" data-view="merge">Merge</button>
  </nav>
  <div id="view-approval" role="tabpanel"></div>
  <div id="view-merge" role="tabpanel"></div>
</main>

<script type="application/json" id="goal-data">
{
  "view": "approval",
  "goal": {"id": "G-0", "title": "Example goal", "outcome": "One line stating the outcome.", "branch": "goal-branch"},
  "approval": {
    "spec": {
      "why": "Why this goal exists.",
      "journeys": ["Journey one, in the user's words."],
      "criteria": [{"id": "AC-1", "text": "Criterion text.", "proof": "python3 -m unittest tests.test_example"}],
      "non_goals": ["Something deliberately out of scope."]
    },
    "design": {
      "choices": [{"choice": "Chosen approach.", "alternatives": "Rejected option, in one line.", "why": "Reason."}]
    },
    "plan": {
      "milestones": [{"id": "M1", "title": "Milestone outcome", "criteria": ["AC-1"],
        "tasks": [{"id": "T1", "title": "Walking skeleton", "risk": "none", "covers": ["AC-1"]}]}],
      "grants": ["local-commit"]
    },
    "decisions": [{"question": "An open decision.", "options": "A or B", "recommendation": "A, because ..."}],
    "risks": [{"risk": "A risk.", "mitigation": "How the plan handles it."}]
  },
  "merge": {
    "milestone": {"id": "M1", "status": "READY", "base": "0000000000", "tree": "0000000000", "diff": "product +0/−0 · tests +0/−0 · docs +0"},
    "criteria": [{"id": "AC-1", "text": "Criterion text.", "proof": "python3 -m unittest tests.test_example", "result": "PASS", "receipt": "exit 0 · 12 run / 0 failed / 0 skipped"}],
    "acceptance": [{"partition": "all", "verdict": "PASS", "reviewer": "vendor model effort", "rounds": 1, "tree": "0000000000"}],
    "decisions_taken": [{"date": "2026-01-01", "task": "T1", "decision": "Chose X over Y.", "how": "default"}],
    "optional_findings": ["An optional finding the founder may promote."],
    "queue": [{"blocks": "T2", "question": "A queued question.", "recommendation": "Recommendation."}]
  }
}
</script>

<script>
(function () {
  "use strict";
  var data = {};
  try { data = JSON.parse(document.getElementById("goal-data").textContent); } catch (e) { data = {}; }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    (children || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      node.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
    });
    return node;
  }
  function list(items) {
    items = items || [];
    if (!items.length) return el("p", {"class": "empty"}, ["None."]);
    return el("ul", {}, items.map(function (i) { return el("li", {}, [String(i)]); }));
  }
  function badge(value) {
    var v = String(value || "—");
    var cls = /^(PASS|READY)$/.test(v) ? "pass" : (/BLOCK|FAIL|NOT READY/.test(v) ? "block" : "warn");
    return el("span", {"class": "badge " + cls}, [v]);
  }
  function table(columns, rows) {
    rows = rows || [];
    if (!rows.length) return el("p", {"class": "empty"}, ["None."]);
    var head = el("thead", {}, [el("tr", {}, columns.map(function (c) { return el("th", {}, [c[0]]); }))]);
    var body = el("tbody", {}, rows.map(function (r) {
      return el("tr", {}, columns.map(function (c) {
        var v = c[2] ? c[2](r[c[1]], r) : r[c[1]];
        return el("td", {"data-label": c[0]}, [v === undefined ? "—" : v]);
      }));
    }));
    return el("div", {"class": "scroll"}, [el("table", {"class": "table"}, [head, body])]);
  }
  function section(title, children) { return el("section", {}, [el("h2", {}, [title])].concat(children)); }
  function code(v) { return el("code", {}, [String(v || "—")]); }
  function joined(v) { return Array.isArray(v) ? v.join(", ") : String(v || "—"); }

  function approval(a) {
    a = a || {}; var spec = a.spec || {}, design = a.design || {}, plan = a.plan || {};
    var milestones = (plan.milestones || []).map(function (m) {
      return el("div", {}, [
        el("h3", {}, [m.id + " — " + (m.title || "")]),
        el("p", {"class": "muted"}, ["Criteria: " + joined(m.criteria)]),
        table([["Task", "id"], ["Title", "title"], ["Risk", "risk"], ["Covers", "covers", joined]], m.tasks)
      ]);
    });
    return [
      section("Spec", [
        el("p", {}, [spec.why || ""]),
        el("h3", {}, ["Journeys"]), list(spec.journeys),
        el("h3", {}, ["Acceptance criteria"]),
        table([["ID", "id"], ["Criterion", "text"], ["Proof", "proof", code]], spec.criteria),
        el("h3", {}, ["Not in scope"]), list(spec.non_goals)
      ]),
      section("Design", [table([["Choice", "choice"], ["Alternatives", "alternatives"], ["Why", "why"]], design.choices)]),
      section("Plan", milestones.concat([el("h3", {}, ["Grants"]), list(plan.grants)])),
      section("Open decisions", [table([["Question", "question"], ["Options", "options"], ["Recommendation", "recommendation"]], a.decisions)]),
      section("Risks", [table([["Risk", "risk"], ["Mitigation", "mitigation"]], a.risks)])
    ];
  }

  function merge(m) {
    m = m || {}; var ms = m.milestone || {};
    return [
      section("Milestone " + (ms.id || ""), [
        el("p", {}, [badge(ms.status), " base ", code(ms.base), " → tree ", code(ms.tree)]),
        el("p", {"class": "muted"}, ["Diff: " + (ms.diff || "—")])
      ]),
      section("Criteria and proof receipts", [table([["ID", "id"], ["Criterion", "text"], ["Proof", "proof", code],
        ["Result", "result", badge], ["Receipt", "receipt"]], m.criteria)]),
      section("Acceptance", [table([["Partition", "partition"], ["Verdict", "verdict", badge], ["Reviewer", "reviewer"],
        ["Rounds", "rounds"], ["Tree", "tree", code]], m.acceptance)]),
      section("Decisions taken by default or escalation", [table([["Date", "date"], ["Task", "task"],
        ["Decision", "decision"], ["How", "how"]], m.decisions_taken)]),
      section("Optional findings", [list(m.optional_findings)]),
      section("Queue", [table([["Blocks", "blocks"], ["Question", "question"], ["Recommendation", "recommendation"]], m.queue)])
    ];
  }

  var goal = data.goal || {};
  document.getElementById("title").textContent = (goal.id ? goal.id + " — " : "") + (goal.title || "Goal");
  document.getElementById("outcome").textContent = goal.outcome || "";
  document.title = (goal.id || "Goal") + " explainer";
  var views = {approval: approval(data.approval), merge: merge(data.merge)};
  Object.keys(views).forEach(function (k) {
    var host = document.getElementById("view-" + k);
    views[k].forEach(function (n) { host.appendChild(n); });
  });
  function show(name) {
    ["approval", "merge"].forEach(function (k) {
      document.getElementById("view-" + k).hidden = k !== name;
      document.getElementById("tab-" + k).setAttribute("aria-selected", String(k === name));
    });
  }
  document.querySelectorAll("nav button").forEach(function (b) {
    b.addEventListener("click", function () { show(b.getAttribute("data-view")); });
  });
  show(data.view === "merge" ? "merge" : "approval");
})();
</script>
</body>
</html>
