<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="256" viewBox="0 0 1080 256" role="img" aria-labelledby="title desc">
<title id="title">Published skill surface: one execution skill and two supporting skills</title>
<desc id="desc">A stacked bar of three published skills: execution-methodology carries goal execution; agent-personas and progressive-disclosure support it with roles and routing.</desc>
<rect width="1080" height="256" rx="8" fill="#fbf8f1"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="40" y="38" font-size="13" font-weight="700" letter-spacing="2" fill="#576164">PUBLISHED SKILL SURFACE</text>
<text x="40" y="76" font-size="27" font-weight="700" fill="#202526">3 skills. One lifecycle.</text>
<rect x="40" y="102" width="500" height="60" fill="#12616a"/>
<rect x="540" y="102" width="250" height="60" fill="#435257"/>
<rect x="790" y="102" width="250" height="60" fill="#576164"/>
<g fill="#fff" font-size="18" font-weight="650" text-anchor="middle">
<text x="290" y="139">execution-methodology</text>
<text x="665" y="139">agent-personas</text>
<text x="915" y="139" font-size="15">progressive-disclosure</text>
</g>
<g font-size="15" fill="#435257">
<text x="40" y="192">Goals, gates, review</text>
<text x="540" y="192">Roles and routing</text>
<text x="790" y="192">Route and checks</text>
</g>
<path d="M40 213H1040" stroke="#cecfc6"/>
<text x="40" y="239" font-size="13" fill="#576164">Each segment is one published skill; the table below names its responsibility.</text>
</g>
</svg>
