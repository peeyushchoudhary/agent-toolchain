<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="256" viewBox="0 0 1080 256" role="img" aria-labelledby="title desc">
<title id="title">Published skill surface: one execution skill and three supporting skills</title>
<desc id="desc">A stacked bar of four published skills: execution-methodology carries goal execution; agent-personas, progressive-disclosure and graph-navigation support it with roles, routing and graph queries.</desc>
<rect width="1080" height="256" rx="8" fill="#fbf8f1"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="40" y="38" font-size="13" font-weight="700" letter-spacing="2" fill="#576164">PUBLISHED SKILL SURFACE</text>
<text x="40" y="76" font-size="27" font-weight="700" fill="#202526">4 skills. One lifecycle.</text>
<rect x="40" y="102" width="400" height="60" fill="#12616a"/>
<rect x="440" y="102" width="200" height="60" fill="#435257"/>
<rect x="640" y="102" width="200" height="60" fill="#576164"/>
<rect x="840" y="102" width="200" height="60" fill="#ca8b2c"/>
<g fill="#fff" font-size="18" font-weight="650" text-anchor="middle">
<text x="240" y="139">execution-methodology</text>
<text x="540" y="139">agent-personas</text>
<text x="740" y="139" font-size="15">progressive-disclosure</text>
<text x="940" y="139" fill="#202526">graph-navigation</text>
</g>
<g font-size="15" fill="#435257">
<text x="40" y="192">Goals, gates, review</text>
<text x="440" y="192">Roles and routing</text>
<text x="640" y="192">Route and checks</text>
<text x="840" y="192">Graph queries</text>
</g>
<path d="M40 213H1040" stroke="#cecfc6"/>
<text x="40" y="239" font-size="13" fill="#576164">Each segment is one published skill; the table below names its responsibility.</text>
</g>
</svg>
